name: Fetch pinned PixiJS runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-pixi.yml"

permissions:
  contents: write

jobs:
  fetch-pixi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PixiJS 8.21.0 production build
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --silent --show-error \
            https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js \
            --output vendor/pixi.min.js
          test -s vendor/pixi.min.js
          wc -c vendor/pixi.min.js
      - name: Commit vendored runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/pixi.min.js
          if git diff --cached --quiet; then
            echo "PixiJS runtime already matches pinned build."
          else
            git commit -m "Vendor PixiJS 8.21.0 production runtime"
            git push
          fi
