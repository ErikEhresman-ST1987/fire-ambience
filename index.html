<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Fire Ambience</title>
  <link rel="stylesheet" href="css/app.css?v=25">
  <script src="vendor/pixi.min.js"></script>
</head>
<body>
  <main id="app" aria-label="Fire Ambience">
    <p id="status" role="status">Preparing fire…</p>
    <div id="fire-controls" aria-label="Fire controls">
      <label class="scene-picker">
        <span>Scene</span>
        <select id="scene-select">
          <option value="fireplace">Fireplace</option>
          <option value="campfire">Campfire</option>
          <option value="woodstove">Wood Stove</option>
        </select>
      </label>
      <button id="start-fire" type="button">Start Fire</button>
    </div>
  </main>
  <script type="module" src="js/app.js?v=25"></script>
</body>
</html>
